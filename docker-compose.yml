services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: academic-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic}
      POSTGRES_USER: ${POSTGRES_USER:-academic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academic_dev_pw}
      # 中文检索需要正确的排序规则，否则 BM25 与分词可能异常
      LANG: C.UTF-8
    ports:
      # 用 5434 避开本机其它项目的 5432/5433
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academic} -d ${POSTGRES_DB:-academic}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
    name: academic_pgdata
