[project]
name = "academic-system"
version = "0.1.0"
description = "An agentic personal academic knowledge assistant with long-term memory (COMP7608B Group 36)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=5.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.5",
    "streamlit>=1.39",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
